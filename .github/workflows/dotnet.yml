name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      SOLUTION_PATH: C:\Users\erp\source\repos\WebApplication1\WebApplication1\WebApplication1\WebApplication1.sln

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore packages
        run: dotnet restore "$SOLUTION_PATH"

      - name: Build solution
        run: dotnet build "$SOLUTION_PATH" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "$SOLUTION_PATH" --configuration Release --no-build --logger trx